<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio programisty - nowoczesne aplikacje i inteligentne systemy" />
    <title>Portfolio - Developer</title>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Sans:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      body {
        visibility: hidden;
      }
      body.loaded {
        visibility: visible !important;
      }
      body {
        animation: force-visible 0.01s 3s forwards;
      }
      @keyframes force-visible {
        to {
          visibility: visible !important;
        }
      }
    </style>
    <script>
      setTimeout(function() {
        if (document.body && !document.body.classList.contains('loaded')) {
          document.body.classList.add('loaded');
          document.body.style.visibility = 'visible';
        }
      }, 1000);
    </script>
  </head>
  <body class="dark font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
